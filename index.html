      * {

        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: linear-gradient(180deg, #eef7f7 0%, #f8fafc 100%);
        color: #1f2937;
        padding: 16px;
        min-height: 100vh;
        -webkit-text-size-adjust: 100%;
      }
      .max-w-6xl {
        max-width: 1152px;
        margin: 0 auto;
      }
      header {
        margin-bottom: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #111827;
      }
      .sub-title {
        font-size: 0.875rem;
        color: #afafb1;
        margin-top: 4px;
      }

      /* 响应式栅格布局 */
      .main-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }

      /* 筛选面板样式 */
      .filter-panel {
        background-color: #ffffff;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        height: fit-content;
        border: 1px solid rgba(148, 163, 184, 0.15);
      }
      .panel-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 16px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: #4b5563;
        margin-bottom: 6px;
      }
      select,
      input[type="search"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background-color: #f9fafb;
        font-size: 0.95rem;
        outline: none;
        transition:
          border 0.2s,
          box-shadow 0.2s,
          background-color 0.2s;
      }
      select:focus,
      input[type="search"]:focus {
        border-color: #14b8a6;
        box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
        background-color: #ffffff;
      }
      .search-helper {
        font-size: 0.75rem;
        color: #6b7280;
        margin-top: 6px;
        line-height: 1.5;
      }
      .tip-box {
        font-size: 0.75rem;
        color: #b45309;
        background-color: #fffbeb;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #fde68a;
        line-height: 1.4;
      }
      .action-row {
        display: flex;
        gap: 12px;
        margin: 20px 0 24px;
      }
      .ghost-button {
        flex: 1;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #f8fafc;
        color: #0f172a;
        padding: 11px 14px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          background-color 0.2s;
      }
      .ghost-button:hover {
        background-color: #eff6ff;
        box-shadow: 0 8px 18px rgba(14, 116, 144, 0.08);
        transform: translateY(-1px);
      }

      /* 结果区域样式 */
      .result-header {
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 16px;
        backdrop-filter: blur(12px);
      }
      .result-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: #374151;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .result-summary {
        margin-top: 10px;
        font-size: 0.85rem;
        color: #64748b;
        line-height: 1.6;
      }
      .count-badge {
        color: #0f766e;
        font-weight: 700;
      }
      .cards-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      /* 卡片样式 */
      .card {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 16px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .card:hover {
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
        transform: translateY(-2px);
      }
      .card-title {
        font-size: 1rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
      }
      .card-info {
        font-size: 0.8rem;
        color: #4b5563;
      }
      .card-info p {
        margin-bottom: 6px;
        display: flex;
        align-items: center;
      }
      .card-info p:last-child {
        margin-bottom: 0;
      }
      .card-notes {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #dbe4ef;
      }
      .card-notes p {
        margin-bottom: 6px;
        color: #0f766e;
      }
      .card-notes p:last-child {
        margin-bottom: 0;
      }
      .icon {
        margin-right: 8px;
        font-size: 1rem;
      }
      .empty-state {
        text-align: center;
        color: #9ca3af;
        padding: 32px;
        background: #fff;
        border-radius: 16px;
        grid-column: 1 / -1;
        border: 1px dashed #cbd5e1;
      }
      mark {
        background: linear-gradient(120deg, #fef3c7 0%, #fde68a 100%);
        color: #92400e;
        padding: 0 4px;
        border-radius: 4px;
      }

      /* 电脑端媒体查询自动适配宽度 */
      @media (min-width: 768px) {
        header {
          text-align: left;
        }
        h1 {
          font-size: 1.875rem;
        }
        .main-layout {
          grid-template-columns: 1fr 3fr;
        }
        .cards-container {
          grid-template-columns: repeat(2, 1fr);
        }
        .filter-panel {
          position: sticky;
          top: 24px;
        }
      }
      html.lock-expired,
      html.lock-expired body {
        background: #ffffff !important;
      }
      html.lock-expired body > * {
        display: none !important;
      }

      (function () {
        const config = window.__catchmentTimeLockConfig;
        const decodeBase64Utf8 = (encodedValue) => {
          if (!encodedValue) {
            return "";
          }

          try {
            const binaryText = window.atob(encodedValue);
            const bytes = Uint8Array.from(binaryText, (char) =>
              char.charCodeAt(0)
            );
            return new TextDecoder().decode(bytes);
          } catch (error) {
            return "";
          }
        };
        const expiresAt = decodeBase64Utf8(config.expiresAtEncoded);
        const expiresAtMs = new Date(expiresAt).getTime();
        const expired =
          Number.isFinite(expiresAtMs) && Date.now() > expiresAtMs;

        window.__catchmentTimeLockState = {
          expiresAt,
          expired,
        };

        if (expired) {
          document.documentElement.classList.add("lock-expired");
        }
      })();

      function normalizeText(value) {

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function escapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

          return safeText;
        }

        const pattern = new RegExp(escapeRegExp(keyword.trim()), "ig");
        return safeText.replace(
          pattern,
          (match) => `<mark>${escapeHtml(match)}</mark>`
        );
      }

      function getSearchPool(item) {
        return [
          item.community,
          item.elementary,
          item.middle,
          ...(Array.isArray(item.searchTerms) ? item.searchTerms : []),
          ...(Array.isArray(item.notes) ? item.notes : []),
        ]
          .filter(Boolean)
          .join(" | ");
      }

      function getFilterState() {
        return {
          selectedEl: document.getElementById("elementarySelect").value,
          selectedMd: document.getElementById("middleSelect").value,
          communityKeyword: document
            .getElementById("communitySearch")
            .value.trim(),
        };
      }

      function formatSummary(state, count) {
        const parts = [];

        if (state.selectedEl !== "ALL") {
          parts.push(`小学：${state.selectedEl}`);
        }

        if (state.selectedMd !== "ALL") {
          parts.push(`初中：${state.selectedMd}`);
        }

        if (state.communityKeyword) {
          parts.push(`小区关键字：${state.communityKeyword}`);
        }

        if (parts.length === 0) {
          return `当前显示全部小区数据，共 ${count} 条。`;
        }

        return `当前条件：${parts.join(" ｜ ")}，共匹配 ${count} 条结果。`;
      }

      function getUniqueSortedOptions(items, fieldName, orderField) {
        const optionMap = new Map();

        items.forEach((item, index) => {
          const value = item[fieldName];
          if (!value || optionMap.has(value)) {
            return;
          }

          optionMap.set(value, {
            value,
            order:
              typeof item[orderField] === "number"
                ? item[orderField]
                : Number.MAX_SAFE_INTEGER,
            index,
          });
        });

        return [...optionMap.values()]
          .sort((a, b) => {
            if (a.order !== b.order) {
              return a.order - b.order;
            }

            return a.index - b.index;
          })
          .map((item) => item.value);
      }

      function populateSelect(selectId, options, currentValue, placeholder) {
        const select = document.getElementById(selectId);
        select.innerHTML = "";
        select.add(new Option(placeholder, "ALL"));

        options.forEach((option) => {
          if (option !== "ALL") {
            select.add(new Option(option, option));
          }
        });

        const nextValue = options.includes(currentValue) ? currentValue : "ALL";
        select.value = nextValue;
        return nextValue;
      }

      function syncSchoolSelectOptions() {
        const state = getFilterState();
        const middleScopedData =
          state.selectedMd === "ALL"
            ? schoolData
            : schoolData.filter((item) => item.middle === state.selectedMd);
        const elementaryScopedData =
          state.selectedEl === "ALL"
            ? schoolData
            : schoolData.filter((item) => item.elementary === state.selectedEl);

        const availableElementaries = getUniqueSortedOptions(
          middleScopedData,
          "elementary",
          "elementaryOrder"
        );
        const availableMiddles = getUniqueSortedOptions(
          elementaryScopedData,
          "middle",
          "middleOrder"
        );

        const nextElementary = populateSelect(
          "elementarySelect",
          availableElementaries,
          state.selectedEl,
          "-- 全部小学 --"
        );
        const nextMiddle = populateSelect(
          "middleSelect",
          availableMiddles,
          state.selectedMd,
          "-- 全部初中 --"
        );

        return {
          ...state,
          selectedEl: nextElementary,
          selectedMd: nextMiddle,
        };
      }

      // 初始化下拉框选项
      function initSelects() {
        syncSchoolSelectOptions();
      }

      // 过滤与渲染
      function renderCards() {
        const state = syncSchoolSelectOptions();
        const container = document.getElementById("cardsContainer");
        const summary = document.getElementById("resultSummary");
        const normalizedKeyword = normalizeText(state.communityKeyword);

        const filteredData = schoolData.filter((item) => {
          const elMatch =
            state.selectedEl === "ALL" || item.elementary === state.selectedEl;
          const mdMatch =
            state.selectedMd === "ALL" || item.middle === state.selectedMd;
          const communityMatch =
            !normalizedKeyword ||
            normalizeText(getSearchPool(item)).includes(normalizedKeyword);
          return elMatch && mdMatch && communityMatch;
        });

        document.getElementById("resultCount").innerText = filteredData.length;
        summary.innerText = formatSummary(state, filteredData.length);

        if (filteredData.length === 0) {
          container.innerHTML = `
                    <div class="empty-state">
                        💨 没有找到满足当前条件的小区，请尝试调整学校筛选或缩短小区关键字。
                    </div>`;
          return;
        }

        container.innerHTML = filteredData
          .map(
            (item) => `
                <div class="card">
                    <div class="card-title">🏢 ${highlightText(item.community, state.communityKeyword)}</div>
                    <div class="card-info">
                        <p><span class="icon">🏫</span><strong>小学：</strong>${escapeHtml(item.elementary === "ALL" ? "未指定" : item.elementary)}</p>
                        <p><span class="icon">🎓</span><strong>初中：</strong>${escapeHtml(item.middle === "ALL" ? "未指定" : item.middle)}</p>
                    </div>${
                      Array.isArray(item.notes) && item.notes.length
                        ? `
                    <div class="card-notes">
                        ${item.notes
                          .map(
                            (note) =>
                              `<p><span class="icon">📝</span><strong>备注：</strong>${highlightText(note, state.communityKeyword)}</p>`
                          )
                          .join("")}
                    </div>`
                        : ""
                    }
                </div>
            `
          )
          .join("");
      }

      function clearFilters() {
        document.getElementById("elementarySelect").value = "ALL";
        document.getElementById("middleSelect").value = "ALL";
        document.getElementById("communitySearch").value = "";
        renderCards();
      }

      function enforceTimeLock() {
        const lockState = window.__catchmentTimeLockState;
        const lockConfig = window.__catchmentTimeLockConfig;

        if (!lockState?.expired) {
          return false;
        }

        document.documentElement.classList.add("lock-expired");
        document.body.innerHTML = "";
        window.alert(
          lockConfig?.alertMessage || "当前页面已到期，请更换新的版本后再使用。"
        );
        return true;
      }

      if (!enforceTimeLock()) {
        document
          .getElementById("elementarySelect")
          .addEventListener("change", renderCards);
        document
          .getElementById("middleSelect")
          .addEventListener("change", renderCards);
        document
          .getElementById("communitySearch")
          .addEventListener("input", renderCards);
        document
          .getElementById("clearFiltersBtn")
          .addEventListener("click", clearFilters);

        initSelects();
        renderCards();
      }
    </script>
  </body>
</html>
